services:
  - type: web
    name: demo-retail-app
    runtime: node
    buildCommand: echo skip
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MASTER_DATABASE_URL
        sync: false
